<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Menu</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0f1722;
    --blue:#2AABEE;
    --green:#4CAF50;
    --red:#C0392B;
    --purple:#8E44AD;
    --text:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh; padding:14px 12px 32px;
    -webkit-tap-highlight-color:transparent;
  }
  .header{
    text-align:center;padding:8px 8px 20px;font-size:15px;
    opacity:.9;line-height:1.5;
  }
  .row{display:flex;gap:10px;margin-bottom:10px;}
  .row.cols-2 > .btn{flex:1 1 0;min-width:0;}
  .btn{
    display:flex;align-items:center;justify-content:flex-start;gap:12px;
    width:100%;padding:18px 16px;border:none;border-radius:12px;
    color:#fff;font-size:16px;font-weight:600;cursor:pointer;
    text-align:left;transition:filter .12s;user-select:none;
    font-family:inherit;line-height:1.25;
  }
  .btn:active{filter:brightness(.85);}
  .btn.blue{background:var(--blue);}
  .btn.green{background:var(--green);}
  .btn.red{background:var(--red);}
  .btn.purple{background:var(--purple);}
  .btn .icon{font-size:22px;line-height:1;flex-shrink:0;}
  .btn .label{flex:1;min-width:0;word-break:break-word;}
  .hidden{display:none !important;}
</style>
</head>
<body>

<div class="header">👋 Use the menu below to get started.</div>

<!-- 🛍️ Buy Telegram Accounts — full width, blue -->
<div class="row">
  <button class="btn blue" data-action="shop_0">
    <span class="icon">🛍️</span>
    <span class="label">Buy Telegram Accounts</span>
  </button>
</div>

<!-- 🧑‍💼 My Profile  |  💰 Top-Up Balance -->
<div class="row cols-2">
  <button class="btn blue" data-action="account">
    <span class="icon">🧑‍💼</span>
    <span class="label">My Profile</span>
  </button>
  <button class="btn green" data-action="recharge">
    <span class="icon">💰</span>
    <span class="label">Top-Up Balance</span>
  </button>
</div>

<!-- 📜 Terms & Rules  |  🔖 Special Discount Accounts -->
<div class="row cols-2">
  <button class="btn red" data-action="rules">
    <span class="icon">📜</span>
    <span class="label">Terms &amp; Rules</span>
  </button>
  <button class="btn purple" data-action="open_proof">
    <span class="icon">🔖</span>
    <span class="label" id="proofLabel">Special Discount Accounts</span>
  </button>
</div>

<!-- 📞 Contact Support — full width -->
<div class="row">
  <button class="btn blue" data-action="open_contact">
    <span class="icon">📞</span>
    <span class="label" id="contactLabel">Contact Support</span>
  </button>
</div>

<!-- ⚙️ Admin Control — hidden for non-admins -->
<div class="row hidden" id="adminRow">
  <button class="btn red" data-action="admin">
    <span class="icon">⚙️</span>
    <span class="label">Admin Control</span>
  </button>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  const params = new URLSearchParams(location.search);

  // Show admin row only if admin=1
  if (params.get("admin") === "1") {
    document.getElementById("adminRow").classList.remove("hidden");
  }

  // Override proof / contact labels from bot's admin-set texts (params pt / ct)
  const proofOverride = params.get("pt");
  const contactOverride = params.get("ct");
  if (proofOverride) {
    // strip any leading emoji from the override so we keep our nice 🔖 icon
    const cleaned = proofOverride.replace(/^[\p{Emoji}\s]+/u, "").trim();
    if (cleaned) document.getElementById("proofLabel").textContent = cleaned;
  }
  if (contactOverride) {
    const cleaned = contactOverride.replace(/^[\p{Emoji}\s]+/u, "").trim();
    if (cleaned) document.getElementById("contactLabel").textContent = cleaned;
  }

  if (tg) { tg.ready(); tg.expand(); }

  document.querySelectorAll(".btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const action = btn.dataset.action;
      if (!action) return;
      if (tg && tg.sendData) tg.sendData(action);
      else alert("Please open this menu from inside Telegram.");
    });
  });
</script>
</body>
</html>
